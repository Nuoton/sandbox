name: CD (Kubernetes)

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - '**' 
  workflow_dispatch:
    inputs:
      VERSION:
        description: 'Версия образов'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-k8s
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Берем код из того коммита, который запустил CI (если это автоматический запуск)
          # Или текущий коммит (если запуск ручной)
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure yc
        env:
          YC_SA_KEY: ${{ secrets.YC_SA_KEY }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/yc-sa-key.json"
          printf '%s' "$YC_SA_KEY" > "$RUNNER_TEMP/yc-sa-key.json"
          
          curl -sL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          
          export PATH=$PATH:/home/runner/yandex-cloud/bin
          
          yc config profile create ci
          yc config set service-account-key "$RUNNER_TEMP/yc-sa-key.json"
          yc config set folder-id "$YC_FOLDER_ID"

          yc --version

      - name: Get kubeconfig
        run: |
          export PATH=$PATH:/home/runner/yandex-cloud/bin
          mkdir -p ~/.kube
          yc managed-kubernetes cluster get-credentials cat5l8psvnrpugr0ibva --external --force

      - name: Install Helm
        run: curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Deploy
        run: |
          export PATH=$PATH:/home/runner/yandex-cloud/bin
          DATE_TAG=$(date +%s)
          helm upgrade --install sandbox ./helm/sandbox -n sandbox \
            --set image.tag=${{ inputs.VERSION || 'latest' }} \
            --set-string podAnnotations.date=$DATE_TAG \
            --wait --timeout 5m

      - name: Verify
        run: |
          export PATH=$PATH:/home/runner/yandex-cloud/bin
          kubectl get pods,svc -n sandbox
          kubectl rollout status deploy/sandbox-backend -n sandbox
          kubectl rollout status deploy/sandbox-frontend -n sandbox