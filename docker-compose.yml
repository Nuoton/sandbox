services:
  backend:
    # Добавлен /repository/
    image: ${IMAGE_REGISTRY}/repository/${REPOSITORY_BACKEND}/sandbox-backend:${IMAGE_TAG}
    container_name: sandbox-backend
    networks:
      - sandbox-net
    ports:
      - "8081:8081"
    env_file:
      - .env
    restart: always

  frontend:
    # Добавлен /repository/
    image: ${IMAGE_REGISTRY}/repository/${REPOSITORY_FRONTEND}/sandbox-frontend:${IMAGE_TAG}
    container_name: sandbox-frontend
    networks:
      - sandbox-net
    ports:
      - "8888:8888"
    depends_on:
      - backend
    env_file:
      - .env
    restart: always

networks:
  sandbox-net:
    driver: bridge