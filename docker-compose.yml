
networks:
  sandbox-net:
    driver: bridge

services:
  backend:
    image: ${IMAGE_REGISTRY}/${REPOSITORY_BACKEND}/sandbox-backend:${IMAGE_TAG}
    ports: ["8081:8081"]
    env_file: .env
    restart: always
  frontend:
    image: ${IMAGE_REGISTRY}/${REPOSITORY_FRONTEND}/sandbox-frontend:${IMAGE_TAG}
    ports: ["8888:8888"]
    depends_on: [backend]
    env_file: .env
    restart: always
