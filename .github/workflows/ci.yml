name: CI/CD Pipeline

on:
  push:
    branches: ["lab3"] 

env:
  VERSION: 1.0.${{ github.run_number }}
  NEXUS_URL: "http://${{ secrets.NEXUS_HOST }}"
  NEXUS_USER: ${{ secrets.NEXUS_REPO_USER }}
  NEXUS_PASS: ${{ secrets.NEXUS_REPO_PASS }}
  REPO_BACKEND: skorokhodov-backend-docker
  REPO_FRONTEND: skorokhodov-frontend-docker

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          docker build -t sandbox-backend:${{ env.VERSION }} ./src/backend
          docker build -t sandbox-frontend:${{ env.VERSION }} ./src/frontend

      - name: Save images to tar
        run: |
          docker save sandbox-backend:${{ env.VERSION }} -o backend.tar
          docker save sandbox-frontend:${{ env.VERSION }} -o frontend.tar

      - name: Upload to Nexus (Raw)
        run: |
          # Используем /repository/ и правильные имена папок
          curl -v -u "${NEXUS_USER}:${NEXUS_PASS}" --upload-file ./backend.tar \
            "${NEXUS_URL}/repository/${REPO_BACKEND}/${VERSION}/backend.tar"
            
          curl -v -u "${NEXUS_USER}:${NEXUS_PASS}" --upload-file ./frontend.tar \
            "${NEXUS_URL}/repository/${REPO_FRONTEND}/${VERSION}/frontend.tar"

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/lab3' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "${{ secrets.VM_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Prepare .env
        run: |
          echo "${{ secrets.APP_ENV_FILE }}" > .env
          echo "VERSION=${{ env.VERSION }}" >> .env

      - name: Copy files to VM
        run: |
          scp -i ~/.ssh/id_rsa docker-compose.yml .env deploy.sh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:~/app/

      - name: Deploy
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} << 'EOF'
            cd ~/app
            export VERSION="${{ env.VERSION }}"
            
            sudo curl -u "${{ secrets.NEXUS_REPO_USER }}:${{ secrets.NEXUS_REPO_PASS }}" -o backend.tar "http://${{ secrets.NEXUS_HOST }}/repository/skorokhodov-backend-docker/${VERSION}/backend.tar"
            sudo curl -u "${{ secrets.NEXUS_REPO_USER }}:${{ secrets.NEXUS_REPO_PASS }}" -o frontend.tar "http://${{ secrets.NEXUS_HOST }}/repository/skorokhodov-frontend-docker/${VERSION}/frontend.tar"
            
            sudo docker load -i backend.tar
            sudo docker load -i frontend.tar
            
            sudo docker compose down
            sudo docker compose up -d
            
            rm -f backend.tar frontend.tar
          EOF