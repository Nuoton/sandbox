name: CI

on:
  push:
    branches: [main, lr4]
  pull_request:
    branches: [main]

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.ver.outputs.VERSION }}
    steps:
      - name: Generate version
        id: ver
        run: echo "VERSION=$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT

  build:
    needs: [version]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: src/${{ matrix.component }}
          push: true
          tags: |
            ghcr.io/${{ github.actor }}/sandbox-${{ matrix.component }}:${{ needs.version.outputs.VERSION }}
            ghcr.io/${{ github.actor }}/sandbox-${{ matrix.component }}:latest
