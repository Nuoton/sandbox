apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-frontend
  labels:
    app: sandbox-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-frontend
  template:
    metadata:
      labels:
        app: sandbox-frontend
    spec:
      containers:
        - name: frontend
          image: "ghcr.io/nuoton/sandbox-frontend:latest"
          imagePullPolicy: Always
          command: ["http-server", "dist", "-p", "8888", "-cors", "--proxy", "http://sandbox-backend:8081"]
          ports:
            - name: http
              containerPort: 8888
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"