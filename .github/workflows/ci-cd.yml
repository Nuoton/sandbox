name: Build and Deploy

on:
  push:
    branches: [ "lab3" ]

env:
  VERSION: 1.0.${{ github.run_number }}
  REGISTRY_GHCR: ghcr.io
  IMAGE_BACKEND: ${{ github.repository }}/sandbox-backend
  IMAGE_FRONTEND: ${{ github.repository }}/sandbox-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./src/backend
          push: true
          tags: |
            ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_BACKEND }}:latest
            ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_BACKEND }}:${{ env.VERSION }}

      - name: Build and push Frontend to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./src/frontend
          push: true
          tags: |
            ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_FRONTEND }}:${{ env.VERSION }}

      - name: Save and Upload to Nexus
        run: |
          docker build -t sandbox-backend:latest ./src/backend
          docker build -t sandbox-frontend:latest ./src/frontend
          docker save sandbox-backend:latest -o backend.tar
          docker save sandbox-frontend:latest -o frontend.tar
          
          curl -u "${{ secrets.NEXUS_REPO_USER }}:${{ secrets.NEXUS_REPO_PASS }}" \
            --upload-file ./backend.tar \
            "http://${{ secrets.NEXUS_HOST }}:8081/repository/skorokhodov-backend/docker/${{ env.VERSION }}/backend.tar"
            
          curl -u "${{ secrets.NEXUS_REPO_USER }}:${{ secrets.NEXUS_REPO_PASS }}" \
            --upload-file ./frontend.tar \
            "http://${{ secrets.NEXUS_HOST }}:8081/repository/skorokhodov-frontend/docker/${{ env.VERSION }}/frontend.tar"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          known_hosts: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
          script: |
            sed -i 's|NEXUS_URL=".*"|NEXUS_URL="http://${{ secrets.NEXUS_HOST }}:8081"|' ~/app/deploy-vm.sh
            export VERSION=${{ env.VERSION }}
            cd ~/app
            ./deploy-vm.sh
