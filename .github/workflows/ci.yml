name: Build Docker Images

on:
  push:
    branches: [ "lab2", "main" ]
  pull_request:
    branches: [ "lab2", "main" ]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Backend
        run: docker build -t sandbox-backend:latest ./src/backend

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Frontend
        run: docker build -t sandbox-frontend:latest ./src/frontend
