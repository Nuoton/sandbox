apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-frontend
  labels:
    app: sandbox-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-frontend
  template:
    metadata:
      labels:
        app: sandbox-frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.image.frontend }}:{{ .Values.image.tag }}"
          imagePullPolicy: Always
          command: ["http-server", "dist", "-p", "{{ .Values.ports.frontend }}", "-a", "0.0.0.0", "-cors"]
          ports:
            - name: http
              containerPort: {{ .Values.ports.frontend }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
