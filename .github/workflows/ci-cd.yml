name: Build and Deploy

on:
  push:
    branches: [ "lab3" ]

# Пункт 4: Ограничения и параллелизм
# Если запустить новый пайплайн в ту же ветку, старый будет отменен
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION: 1.0.${{ github.run_number }}
  REGISTRY_GHCR: ghcr.io
  IMAGE_BACKEND: nuoton/sandbox-backend
  IMAGE_FRONTEND: nuoton/sandbox-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Пункт 4: Ограничение прав (только чтение кода и запись в packages)
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Пункт 5: Прогон модульных тестов (Go)
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          
      - name: Run Unit Tests
        run: |
          cd src/backend
          go test ./...

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./src/backend
          push: true
          tags: |
            ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_BACKEND }}:latest
            ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_BACKEND }}:${{ env.VERSION }}

      - name: Build and push Frontend to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./src/frontend
          push: true
          tags: |
            ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_FRONTEND }}:${{ env.VERSION }}

      - name: Save and Upload to Nexus
        run: |
          docker build -t sandbox-backend:latest ./src/backend
          docker build -t sandbox-frontend:latest ./src/frontend
          docker save sandbox-backend:latest -o backend.tar
          docker save sandbox-frontend:latest -o frontend.tar
          
          curl -u "${{ secrets.NEXUS_REPO_USER }}:${{ secrets.NEXUS_REPO_PASS }}" \
            --upload-file ./backend.tar \
            "http://${{ secrets.NEXUS_HOST }}:8081/repository/skorokhodov-backend/docker/${{ env.VERSION }}/backend.tar"
            
          curl -u "${{ secrets.NEXUS_REPO_USER }}:${{ secrets.NEXUS_REPO_PASS }}" \
            --upload-file ./frontend.tar \
            "http://${{ secrets.NEXUS_HOST }}:8081/repository/skorokhodov-frontend/docker/${{ env.VERSION }}/frontend.tar"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Исправление предупреждения: создаем known_hosts вручную
      - name: Setup SSH known_hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          # Убрали known_hosts из параметров, так как он теперь в файле
          script: |
            sed -i 's|NEXUS_URL=".*"|NEXUS_URL="http://${{ secrets.NEXUS_HOST }}:8081"|' ~/app/deploy-vm.sh
            export VERSION=${{ env.VERSION }}
            cd ~/app
            ./deploy-vm.sh