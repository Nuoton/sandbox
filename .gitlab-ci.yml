stages:
  - build

variables:
  VERSION: 1.0.${CI_PIPELINE_ID}

build-backend:
  stage: build
  trigger:
    include: /src/backend/.gitlab-ci.yml
    strategy: depend
  only:
    changes:
      - src/backend/**/*

build-frontend:
  stage: build
  trigger:
    include: /src/frontend/.gitlab-ci.yml
    strategy: depend
  only:
    changes:
      - src/frontend/**/*
