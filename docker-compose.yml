services:
  backend:
    image: ${REPOSITORY_BACKEND}:${IMAGE_TAG}
    container_name: sandbox-backend
    env_file: .env
    networks: [ sandbox-net ]
    restart: unless-stopped
    ports: [ "8081:8081" ]

  frontend:
    image: ${REPOSITORY_FRONTEND}:${IMAGE_TAG}
    container_name: sandbox-frontend
    env_file: .env
    ports: [ "8888:8888" ]
    depends_on: [ backend ]
    networks: [ sandbox-net ]
    restart: unless-stopped

networks:
  sandbox-net:
    name: sandbox-net
    driver: bridge